<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweet a imagen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;color:#111;display:flex;flex-wrap:wrap;gap:24px;padding:24px;justify-content:center}
.panel{width:340px;background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;align-self:flex-start}
.panel h1{font-size:18px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:#555}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font:inherit;font-size:14px}
textarea{height:100px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px #1d9bf0}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#1d9bf0;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.stage{flex:1;min-width:280px;max-width:1280px;position:relative}
#scaler{width:1280px;height:720px;transform-origin:top left}
#canvas{position:relative;overflow:hidden;width:1280px;height:720px;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2)}
#wm{position:absolute;left:-60%;top:-60%;width:220%;height:220%;background-position:center;pointer-events:none;transform-origin:center}
#card{position:relative;z-index:1;width:520px;max-width:100%;border-radius:16px;padding:20px;background:#fff;color:#0f1419;box-shadow:0 20px 50px #0004;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#card.dark{background:#000;color:#e7e9ea}
.head{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;background:#1d9bf0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background-size:cover;background-position:center;flex:none}
.nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px}
.hd{color:#6b7782;font-size:14px}
#card.dark .hd,#card.dark .meta,#card.dark .stats{color:#71767b}
.txt{font-size:20px;line-height:1.35;margin:14px 0;white-space:pre-wrap;word-wrap:break-word}
#pMedia{width:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid #8884;margin:0 0 14px;display:block;background:#000 center/cover no-repeat}
.chk{display:flex;flex-wrap:wrap;gap:2px 14px}.chk label{font-weight:400;margin:3px 0;display:flex;gap:5px;align-items:center;color:#111}
.meta{color:#6b7782;font-size:14px;padding-bottom:12px;border-bottom:1px solid #8884}
.stats{display:flex;gap:20px;margin-top:12px;font-size:14px;color:#6b7782}
.stats b{color:inherit;filter:contrast(3)}
</style>
</head>
<body>
<div class="panel">
  <h1>🐦 Tweet a imagen</h1>
  <label>Link del tweet (x.com o twitter.com)</label>
  <input type="text" id="url" placeholder="https://x.com/usuario/status/123456789">
  <button id="load" style="margin-top:8px;background:#111">Cargar tweet</button>
  <div id="msg" style="font-size:12px;margin-top:6px;color:#b00"></div>
  <label>Nombre</label><input type="text" id="name" value="Ana Pérez">
  <label>Usuario (sin @)</label><input type="text" id="handle" value="anaperez">
  <label>Foto de perfil (opcional)</label><input type="file" id="avatar" accept="image/*">
  <label>Texto del tweet</label>
  <textarea id="text">Crear en público es la mejor forma de aprender. Empieza hoy, mejora mañana. 🚀</textarea>
  <label>Imagen del tweet (se carga sola con el link, o súbela)</label><input type="file" id="media" accept="image/*">
  <label style="font-weight:400"><input type="checkbox" id="mediaOn" checked> Mostrar imagen del tweet</label>
  <label>Ajuste de la imagen (16:9)</label>
  <select id="fit"><option value="cover">Llenar (recorta a 16:9)</option><option value="contain">Mostrar completa (barras negras)</option></select>
  <label>Fecha y hora</label><input type="text" id="date" value="14 nov. 2026 · 10:30 AM">
  <div class="row">
    <div><label>Respuestas</label><input type="text" id="rep" value="24"></div>
    <div><label>Retweets</label><input type="text" id="rt" value="132"></div>
  </div>
  <div class="row">
    <div><label>Me gusta</label><input type="text" id="lk" value="1.2K"></div>
    <div><label>Vistas</label><input type="text" id="vw" value="48K"></div>
  </div>
  <div class="row">
    <div><label>Tema</label><select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option></select></div>
    <div><label>Verificado</label><select id="ver"><option value="1">Sí</option><option value="0">No</option></select></div>
  </div>
  <label>Mostrar en la tarjeta</label>
  <div class="chk">
    <label><input type="checkbox" id="sDate" checked> Fecha</label>
    <label><input type="checkbox" id="sRep" checked> Respuestas</label>
    <label><input type="checkbox" id="sRt" checked> Retweets</label>
    <label><input type="checkbox" id="sLk" checked> Me gusta</label>
    <label><input type="checkbox" id="sVw" checked> Vistas</label>
  </div>
  <button id="clean" style="margin-top:8px;background:#444">Modo limpio (ocultar todo)</button>
  <label>Fondo</label>
  <div class="swatches" id="sws"></div>
  <label>Color personalizado</label><input type="color" id="custom" value="#ffffff" style="width:100%;height:36px">
  <label style="margin-top:16px">Logo de fondo</label>
  <label style="font-weight:400"><input type="checkbox" id="wmOn" checked> Mostrar logo</label>
  <label style="font-weight:400"><input type="checkbox" id="wmRep" checked> Repetir en mosaico</label>
  <label>Ángulo: <span id="wmAv">-25</span>°</label><input type="range" id="wmA" min="-180" max="180" value="-25" style="width:100%">
  <label>Opacidad: <span id="wmOv">25</span>%</label><input type="range" id="wmO" min="0" max="100" value="25" style="width:100%">
  <label>Tamaño: <span id="wmSv">260</span>px</label><input type="range" id="wmS" min="60" max="900" value="260" style="width:100%">
  <label>Separación: <span id="wmGv">140</span>px</label><input type="range" id="wmG" min="0" max="500" value="140" style="width:100%">
  <label style="font-weight:400"><input type="checkbox" id="wmSt" checked> Escalonado (filas intercaladas)</label>
  <label>Tamaño de la tarjeta: <span id="padv">100</span>%</label><input type="range" id="pad" min="50" max="170" value="100" style="width:100%">
  <button id="dl">⬇ Descargar PNG</button>
</div>

<div class="stage" id="stage">
 <div id="scaler">
  <div id="canvas">
    <div id="wm"></div>
    <div id="card">
      <div class="head">
        <div class="av" id="pAv">A</div>
        <div>
          <div class="nm"><span id="pName"></span><span id="pVer"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1d9bf0" d="M22.5 12.5l-2.1-2.4.3-3.2-3.1-.7-1.6-2.8-3 1.2-3-1.2-1.6 2.8-3.1.7.3 3.2L1.5 12.5l2.1 2.4-.3 3.2 3.1.7 1.6 2.8 3-1.2 3 1.2 1.6-2.8 3.1-.7-.3-3.2z"/><path fill="#fff" d="M10.5 16.5l-3.5-3.4 1.4-1.4 2.1 2 5-5 1.4 1.4z"/></svg></span></div>
          <div class="hd" id="pHandle"></div>
        </div>
      </div>
      <div class="txt" id="pText"></div>
      <div id="pMedia"></div>
      <div class="meta" id="pDate"></div>
      <div class="stats"><span>💬 <b id="pRep"></b></span><span>🔁 <b id="pRt"></b></span><span>❤️ <b id="pLk"></b></span><span>📊 <b id="pVw"></b></span></div>
    </div>
  </div>
 </div>
</div>

<div id="ov" style="display:none;position:fixed;inset:0;z-index:9999;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px">
  <div style="color:#fff;font:600 15px system-ui;text-align:center">Mantén presionada la imagen y elige “Guardar imagen” / “Descargar imagen”</div>
  <img id="ovImg" alt="" style="max-width:100%;max-height:70%;border-radius:8px">
  <button id="ovClose" style="width:auto;padding:10px 28px;margin:0;background:#fff;color:#111">Cerrar</button>
</div>

<script>
const $=id=>document.getElementById(id);
const bgs=["linear-gradient(135deg,#667eea,#764ba2)","linear-gradient(135deg,#f093fb,#f5576c)","linear-gradient(135deg,#4facfe,#00f2fe)","linear-gradient(135deg,#43e97b,#38f9d7)","linear-gradient(135deg,#fa709a,#fee140)","linear-gradient(135deg,#0f2027,#2c5364)","#111111","#ffffff"];
bgs.forEach((b,i)=>{const d=document.createElement("div");d.className="sw"+(i==0?" on":"");d.style.background=b;d.onclick=()=>{document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));d.classList.add("on");$("canvas").style.background=b};$("sws").appendChild(d)});
$("custom").oninput=e=>{document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));$("canvas").style.background=e.target.value};
$("pad").oninput=e=>{$("card").style.transform=`scale(${e.target.value/100})`;$("padv").textContent=e.target.value};
function fit(){const st=$("stage"),k=Math.min(1,st.clientWidth/1280);$("scaler").style.transform=`scale(${k})`;st.style.height=(720*k)+"px"}
addEventListener("resize",fit);fit();

const logoImg=new Image();logoImg.onload=()=>wm();logoImg.src=LOGO;
function tile(w,gap,stag){
  const h=Math.round(w*logoImg.naturalHeight/logoImg.naturalWidth);
  const cw=w+gap,ch=h+gap,k=2;
  const tw=cw,th=stag?ch*2:ch;
  const c=document.createElement("canvas");c.width=tw*k;c.height=th*k;
  const x=c.getContext("2d");x.scale(k,k);
  const px=(gap/2),py=(gap/2);
  x.drawImage(logoImg,px,py,w,h);
  if(stag){const ox=px+cw/2;x.drawImage(logoImg,ox,py+ch,w,h);x.drawImage(logoImg,ox-cw,py+ch,w,h)}
  return {url:c.toDataURL("image/png"),w:tw,h:th};
}
function wm(){
  const el=$("wm"),on=$("wmOn").checked,sz=+$("wmS").value,gap=+$("wmG").value;
  $("wmAv").textContent=$("wmA").value;$("wmOv").textContent=$("wmO").value;$("wmSv").textContent=sz;$("wmGv").textContent=gap;
  el.style.display=on?"block":"none";
  if($("wmRep").checked&&logoImg.naturalWidth){
    const t=tile(sz,gap,$("wmSt").checked);
    el.style.backgroundImage=`url(${t.url})`;
    el.style.backgroundSize=t.w+"px "+t.h+"px";
    el.style.backgroundRepeat="repeat";
  }else{
    el.style.backgroundImage=`url(${LOGO})`;
    el.style.backgroundSize=sz+"px auto";
    el.style.backgroundRepeat="no-repeat";
  }
  el.style.transform=`rotate(${$("wmA").value}deg)`;
  el.style.opacity=$("wmO").value/100;
}
["wmOn","wmRep","wmA","wmO","wmS","wmG","wmSt"].forEach(i=>$(i).addEventListener("input",wm));
function setMedia(src){
  const m=$("pMedia");
  if(src){m.style.backgroundImage=`url("${src}")`;m.dataset.has="1"}else{m.style.backgroundImage="";m.dataset.has=""}
  showMedia();
}
function showMedia(){const m=$("pMedia");m.style.display=(m.dataset.has&&$("mediaOn").checked)?"block":"none"}
$("mediaOn").addEventListener("input",showMedia);
$("fit").addEventListener("input",()=>{$("pMedia").style.backgroundSize=$("fit").value});
$("media").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setMedia(r.result);r.readAsDataURL(f)};
const map={name:"pName",text:"pText",date:"pDate",rep:"pRep",rt:"pRt",lk:"pLk",vw:"pVw"};
function upd(){
  for(const k in map)$(map[k]).textContent=$(k).value;
  $("pHandle").textContent="@"+$("handle").value;
  $("card").className=$("theme").value==="dark"?"dark":"";
  $("pVer").style.display=$("ver").value==="1"?"inline":"none";
  if(!$("pAv").style.backgroundImage)$("pAv").textContent=($("name").value[0]||"?").toUpperCase();
  const vis=[["sRep","pRep"],["sRt","pRt"],["sLk","pLk"],["sVw","pVw"]];
  let any=false;
  vis.forEach(([c,e])=>{const on=$(c).checked;any=any||on;$(e).parentElement.style.display=on?"":"none"});
  document.querySelector(".stats").style.display=any?"flex":"none";
  $("pDate").style.display=$("sDate").checked?"":"none";
  $("pDate").style.borderBottom=any?"":"none";
  $("pDate").style.paddingBottom=any?"":"0";
}
$("clean").onclick=()=>{
  const all=["sDate","sRep","sRt","sLk","sVw"];
  const anyOn=all.some(i=>$(i).checked);
  all.forEach(i=>$(i).checked=!anyOn);
  $("clean").textContent=anyOn?"Mostrar todo":"Modo limpio (ocultar todo)";
  upd();
};
document.querySelectorAll("input,textarea,select").forEach(e=>e.addEventListener("input",upd));
$("avatar").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("pAv").style.backgroundImage=`url(${r.result})`;$("pAv").textContent=""};r.readAsDataURL(f)};
const isTouch=matchMedia("(pointer:coarse)").matches;
function showResult(url){$("ovImg").src=url;$("ov").style.display="flex"}
$("ovClose").onclick=()=>{$("ov").style.display="none"};
$("dl").onclick=async()=>{
  const btn=$("dl"),label="⬇ Descargar PNG";
  btn.textContent="Generando…";btn.disabled=true;
  try{
    const c=await html2canvas($("canvas"),{scale:2,backgroundColor:null,useCORS:true,width:1280,height:720,scrollX:0,scrollY:-window.scrollY,onclone:d=>{d.getElementById("scaler").style.transform="none"}});
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    if(!blob)throw new Error("no se pudo crear la imagen");
    const url=URL.createObjectURL(blob);
    if(isTouch){
      // Celular: menú de compartir (Guardar imagen) o, si no existe, vista para mantener presionado
      const file=new File([blob],"tweet.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file]});btn.textContent=label;btn.disabled=false;return}
        catch(e){if(e.name==="AbortError"){btn.textContent=label;btn.disabled=false;return}}
      }
      showResult(url);
    }else{
      const a=document.createElement("a");a.download="tweet.png";a.href=url;document.body.appendChild(a);a.click();a.remove();
    }
  }catch(e){alert("No se pudo generar la imagen: "+e.message)}
  btn.textContent=label;btn.disabled=false;
};

const fmt=n=>n==null?"0":new Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n);
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function fetchAny(urls,asBlob){
  let last;
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(!r.ok)throw new Error("HTTP "+r.status);
      return asBlob?await r.blob():await r.json();
    }catch(e){last=e}
  }
  throw last||new Error("sin respuesta");
}
const enc=encodeURIComponent;
async function toDataURL(u){
  const b=await fetchAny(["/img?u="+enc(u),u,"https://corsproxy.io/?"+enc(u)],true);
  return blobToDataURL(b);
}
async function getTweet(id){
  const fx=`https://api.fxtwitter.com/i/status/${id}`;
  const j=await fetchAny(["/fx?id="+id,fx,"https://corsproxy.io/?"+enc(fx),"https://api.allorigins.win/raw?url="+enc(fx)]);
  const t=j.tweet;
  if(!t)throw new Error("tweet no encontrado (borrado o privado)");
  return {name:t.author.name,handle:t.author.screen_name,text:t.text,date:t.created_at,
    media:(t.media&&((t.media.photos&&t.media.photos[0]&&t.media.photos[0].url)||(t.media.videos&&t.media.videos[0]&&t.media.videos[0].thumbnail_url)))||"",rep:t.replies,rt:t.retweets,lk:t.likes,vw:t.views,avatar:(t.author.avatar_url||"").replace("_normal","_400x400")};
}
$("load").onclick=async()=>{
  const m=$("url").value.match(/status\/(\d+)/);
  const msg=$("msg");msg.style.color="#b00";
  if(!m){msg.textContent="Link no válido. Debe contener /status/NÚMERO";return}
  $("load").textContent="Cargando…";msg.textContent="";
  try{
    const t=await getTweet(m[1]);
    $("name").value=t.name;$("handle").value=t.handle;
    $("text").value=(t.text||"").replace(/\s*https:\/\/t\.co\/\w+/g,"").trim();
    $("date").value=new Date(t.date).toLocaleString("es",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    $("rep").value=fmt(t.rep);$("rt").value=fmt(t.rt);$("lk").value=fmt(t.lk);$("vw").value=fmt(t.vw);
    $("pAv").style.backgroundImage="";
    try{const d=await toDataURL(t.avatar);$("pAv").style.backgroundImage=`url(${d})`;$("pAv").textContent=""}catch(e){}
    setMedia("");
    if(t.media){try{setMedia(await toDataURL(t.media))}catch(e){msg.style.color="#b60";msg.textContent="Se cargó el tweet, pero no la imagen. Puedes subirla a mano."}}
    upd();
  }catch(e){
    msg.textContent="No se pudo cargar: "+e.message+". Prueba con start.py (ver instrucciones) o rellena a mano.";
  }
  $("load").textContent="Cargar tweet";
};
upd();wm();setMedia("");
</script>
